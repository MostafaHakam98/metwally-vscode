<div id="app">

  <!-- Header ------------------------------------------------------------->
  <header>
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true">
        <use href="#i-bolt" fill="none" stroke="url(#g-brand)" stroke-width="2"/>
      </svg>
      <span class="brand-name">Metwally</span>
    </div>

    <button class="chip" id="model-chip" title="Switch model">
      <svg class="ctx-ring" id="ctx-ring" viewBox="0 0 36 36" aria-hidden="true">
        <circle class="ring-bg" cx="18" cy="18" r="15.9155"/>
        <circle class="ring-fg" cx="18" cy="18" r="15.9155" pathLength="100"/>
      </svg>
      <span class="chip-label" id="model-label">…</span>
    </button>

    <span class="chip" id="usage-chip" title="Session tokens and cost" hidden></span>

    <span class="spacer"></span>

    <div class="icon-rail">
      <button class="icon-btn" id="btn-focus" title="Focus mode — hide thinking and tool calls" aria-pressed="false">
        <svg><use href="#i-focus"/></svg>
      </button>
      <button class="icon-btn" id="btn-history" title="Session history">
        <svg><use href="#i-history"/></svg>
      </button>
      <button class="icon-btn" id="btn-export" title="Export conversation as Markdown">
        <svg><use href="#i-download"/></svg>
      </button>
      <button class="icon-btn" id="btn-settings" title="Metwally settings">
        <svg><use href="#i-gear"/></svg>
      </button>
      <button class="icon-btn" id="btn-new" title="New session">
        <svg><use href="#i-plus"/></svg>
      </button>
    </div>

    <span id="state-dot" title="Idle"></span>
    <div id="progress"></div>
  </header>

  <!-- Chat --------------------------------------------------------------->
  <div id="chat-wrap">
    <div id="chat" class="scroll">
      <div class="stream" id="stream"></div>
    </div>
    <button id="jump" title="Jump to latest">
      <svg><use href="#i-down"/></svg> Latest
    </button>
  </div>

  <!-- Composer ----------------------------------------------------------->
  <footer>
    <div class="composer-wrap">
      <div id="edits"></div>
      <div id="pins"></div>
      <div id="attachments"></div>

      <div id="composer">
        <textarea id="input" rows="1" placeholder="Ask Metwally…" spellcheck="false"></textarea>
        <div class="composer-bar">
          <div class="segmented" id="effort" role="group" aria-label="Reasoning effort">
            <button data-v="off"    title="No extended thinking">Off</button>
            <button data-v="low"    title="Brief reasoning">Low</button>
            <button data-v="medium" title="Balanced reasoning">Med</button>
            <button data-v="high"   title="Deep reasoning" class="on">High</button>
          </div>

          <select class="mini-select" id="temp" title="Sampling temperature">
            <option value="0">Temp 0</option>
            <option value="0.2">Temp 0.2</option>
            <option value="0.5">Temp 0.5</option>
            <option value="0.8">Temp 0.8</option>
            <option value="1">Temp 1.0</option>
          </select>

          <span class="spacer"></span>
          <span id="char-count"></span>

          <button class="ghost-btn" id="btn-context" title="Inspect what is in context (/context)">
            <svg><use href="#i-scan"/></svg>
          </button>
          <button class="ghost-btn" id="btn-add" title="Add workspace context">
            <svg><use href="#i-plus"/></svg>
          </button>
          <button class="ghost-btn" id="btn-mention" title="Add file context (@)">
            <svg><use href="#i-at"/></svg>
          </button>
          <button class="ghost-btn" id="btn-attach" title="Attach image or file">
            <svg><use href="#i-paperclip"/></svg>
          </button>
          <button id="btn-send" title="Send — Enter" disabled>
            <svg><use href="#i-send"/></svg>
          </button>
        </div>
      </div>
    </div>
  </footer>
</div>

<div id="toasts"></div>

<script nonce="{{nonce}}" src="{{highlightUri}}"></script>
<script nonce="{{nonce}}" src="{{markdownUri}}"></script>
<script nonce="{{nonce}}" src="{{scriptUri}}"></script>
</body>
</html>
